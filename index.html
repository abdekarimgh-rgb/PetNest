
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetNest</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white">

  <header class="relative flex items-center justify-between px-4 py-4 shadow-sm md:px-8">

    <a href="index.html"
       class="flex items-center gap-2 text-2xl font-bold text-gray-800">
      <img
        src="img/PetNest Pet Care Logo.png"
        alt="Logo PetNest"
        class="h-12 w-12 object-contain"
      >
      <h1>PetNest</h1>
    </a>

    <button
      type="button"
      class="text-3xl text-gray-800 md:hidden"
      id="burger"
      aria-label="Ouvrir le menu"
      aria-controls="navLinks"
      aria-expanded="false"
    >
      ☰
    </button>

<nav id="navLinks"
  class="absolute left-0 top-full z-50 hidden w-full flex-col bg-white p-4 shadow-md md:static md:flex md:w-auto md:flex-row md:items-center md:gap-6 md:bg-transparent md:p-0 md:shadow-none">

  <a href="index.html"
     class="block w-full rounded-lg px-3 py-3 text-gray-700 hover:bg-gray-100 md:w-auto">
    Accueil
  </a>

  <a href="boutique.html"
     class="block w-full rounded-lg px-3 py-3 text-gray-700 hover:bg-gray-100 md:w-auto">
    Boutique
  </a>

  <a href="adoption.html"
     class="block w-full rounded-lg px-3 py-3 text-gray-700 hover:bg-gray-100 md:w-auto">
    Adoption
  </a>

  <a href="services.html"
     class="block w-full rounded-lg px-3 py-3 text-gray-700 hover:bg-gray-100 md:w-auto">
    Services
  </a>

  <a href="contact.html"
     class="block w-full rounded-lg px-3 py-3 text-gray-700 hover:bg-gray-100 md:w-auto">
    Contactez-nous
  </a>

  <a href="contact.html"
     class="block w-full rounded-lg bg-orange-500 px-5 py-3 text-center font-semibold text-white hover:bg-orange-600 md:w-auto">
    Prendre RDV
  </a>

</nav>

  </header>

  <script>
    const burger = document.getElementById("burger");
    const navLinks = document.getElementById("navLinks");

    burger.addEventListener("click", function () {
      const isOpen = navLinks.classList.toggle("hidden");

      burger.setAttribute("aria-expanded", String(!isOpen));
      burger.setAttribute(
        "aria-label",
        isOpen ? "Ouvrir le menu" : "Fermer le menu"
      );

      burger.textContent = isOpen ? "☰" : "✕";
    });
  </script>
  
</body>
</html>
